name: Build

# Tests, then cross-compiles the command for every OS × architecture in the
# matrix (one archive per target). Nothing is uploaded as an Actions artifact:
# a v* tag creates a draft GitHub Release, each target attaches its archive to
# it, and the release job adds the checksums and publishes it.
#
# To cut a release:
#   git tag -a v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  NAME: sonolus-notgarupa-particle-generator

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release published on the web (which pushed the tag) keeps its notes
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          {
            echo "### 安装"
            echo
            echo "下载对应平台的压缩包，解压后把 \`$NAME\` 放到 PATH 中即可，\`$NAME -h\` 查看全部参数（压缩包内附 README）。"
            echo "程序已内置所需的 APK 资源，其余素材运行时联网下载到 \`.cache/\`。"
          } > notes.md
          prerelease=""; [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes $prerelease

  build:
    needs: [test, draft]
    # draft is skipped off a tag
    if: ${{ !cancelled() && needs.test.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    permissions:
      contents: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          arch="$GOARCH"; [ "$arch" = amd64 ] && arch="x86_64"
          archive="${NAME}_${version#v}_${GOOS}_${arch}"
          mkdir -p dist/pkg
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/pkg/$NAME$ext" "./cmd/$NAME"
          cp README.md dist/pkg/
          if [ "$GOOS" = windows ]; then
            (cd dist/pkg && zip -q "../$archive.zip" ./*)
          else
            tar -czf "dist/$archive.tar.gz" -C dist/pkg .
          fi
          rm -r dist/pkg
          ls -l dist
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add the checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "${NAME}_*"
          sha256sum -- * > checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
